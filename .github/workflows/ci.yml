name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: cp .env.example .env
      - run: docker compose config --quiet
