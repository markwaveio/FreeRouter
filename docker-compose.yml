name: freerouter

services:
  db:
    image: postgres:16
    container_name: freerouter-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - freerouter_postgres_data:/var/lib/postgresql/data

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm-database:latest}
    container_name: freerouter-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FREEROUTER_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZENMUX_API_KEY: ${ZENMUX_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
      - ./freerouter_config.py:/app/freerouter_config.py:ro
    tmpfs:
      - /app/runtime
    entrypoint: ["python", "/app/freerouter_config.py"]
    command: []
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  freerouter_postgres_data:
