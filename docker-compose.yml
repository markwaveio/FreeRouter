name: freerouter

services:
  db:
    image: postgres:16
    container_name: freerouter-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - freerouter_postgres_data:/var/lib/postgresql/data

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm-database:latest}
    container_name: freerouter-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FREEROUTER_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config:/app/config:ro
    command: ["--config", "/app/config/litellm-config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  refresher:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm-database:latest}
    container_name: freerouter-refresher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      FREEROUTER_GATEWAY_URL: http://litellm:4000
      FREEROUTER_PROVIDERS_DIR: /app/providers
      FREEROUTER_STATE_DIR: /app/state
    volumes:
      - ./freerouter:/app/freerouter:ro
      - ./providers:/app/providers:ro
      - ./state:/app/state
    entrypoint: ["python", "-m", "freerouter"]
    command: ["daemon"]
    depends_on:
      litellm:
        condition: service_healthy

volumes:
  freerouter_postgres_data:
