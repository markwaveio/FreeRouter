[project]
name = "freerouter"
version = "0.2.0"
description = "A zero-price model router built on the LiteLLM proxy"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "typing-extensions>=4.14,<5",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["freerouter", "tests"]

# Tests build models from literal dicts and stub collaborators, so the strictest
# dynamic-typing rules are relaxed there only. The package itself stays at "all".
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D100", "D101", "D103", "D105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "PLR0913", "PLR0917"]
"tests/conftest.py" = ["ANN401", "D", "S101"]
